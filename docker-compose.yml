version: '3.8'

services:
  # ==========================================
  # FastAPI Backend Service (Port 8005)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter-backend
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - newsletter-network

  # ==========================================
  # React + Vite Frontend via Nginx (Port 3055)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newsletter-frontend
    restart: unless-stopped
    ports:
      - "3055:80"
    depends_on:
      - backend
    networks:
      - newsletter-network

networks:
  newsletter-network:
    driver: bridge
